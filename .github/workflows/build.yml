name: Build CHIWAWA AutoRP Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Resmi
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Terima Lisensi Android SDK & Compile APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          mkdir -p app/src/main/java/com/chiwawa/autorp
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/chiwawa/autorp/MainActivity.java
          cp FloatingOverlayService.java app/src/main/java/com/chiwawa/autorp/FloatingOverlayService.java
          echo 'rootProject.name = "ChiwawaAutoRP"' > settings.gradle
          echo 'include ":app"' >> settings.gradle
          echo 'buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.1.0" } }' > build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle
          echo 'plugins { id "com.android.application" }' > app/build.gradle
          echo 'android {' >> app/build.gradle
          echo '    namespace "com.chiwawa.autorp"' >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo '        applicationId "com.chiwawa.autorp"' >> app/build.gradle
          echo '        minSdk 23' >> app/build.gradle
          echo '        targetSdk 33' >> app/build.gradle
          echo '        versionCode 2' >> app/build.gradle
          echo '        versionName "2.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '    lintOptions { checkReleaseBuilds false; abortOnError false }' >> app/build.gradle
          echo '}' >> app/build.gradle
          gradle assembleDebug --no-daemon

      - name: Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: CHIWAWA-AutoRP-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
