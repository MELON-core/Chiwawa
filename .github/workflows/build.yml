name: Build CHIWAWA AutoRP Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Resmi
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Terima Lisensi Android SDK Bawaan & Compile APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          mkdir -p app/src/main/java/com/chiwawa/autorp
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/chiwawa/autorp/MainActivity.java
          cp FloatingOverlayService.java app/src/main/java/com/chiwawa/autorp/FloatingOverlayService.java

          printf 'rootProject.name = "ChiwawaAutoRP"\ninclude ":app"\n' > settings.gradle

          printf 'buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath "com.android.tools.build:gradle:8.1.0" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle

          printf 'plugins { id "com.android.application" }\nandroid {\n    namespace "com.chiwawa.autorp"\n    compileSdk 33\n    defaultConfig {\n        applicationId "com.chiwawa.autorp"\n        minSdk 23\n        targetSdk 33\n        versionCode 1\n        versionName "1.0"\n    }\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' > app/build.gradle

          gradle assembleDebug --no-daemon

      - name: Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: CHIWAWA-AutoRP-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
