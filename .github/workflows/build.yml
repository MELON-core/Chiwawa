name: Build CHIWAWA AutoRP Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Project & Compile Debug APK
        run: |
          mkdir -p app/src/main/java/com/chiwawa/autorp
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/chiwawa/autorp/MainActivity.java
          cp FloatingOverlayService.java app/src/main/java/com/chiwawa/autorp/FloatingOverlayService.java

          cat << 'EOF' > settings.gradle
          rootProject.name = "ChiwawaAutoRP"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.chiwawa.autorp'
              compileSdk 33
              defaultConfig {
                  applicationId "com.chiwawa.autorp"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug

      - name: Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: CHIWAWA-AutoRP-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
